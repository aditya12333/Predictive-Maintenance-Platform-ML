global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: predictive-maintenance-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: predictive-maintenance-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
