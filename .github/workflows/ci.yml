name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python checks and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PM_DATABASE_URL: postgresql+psycopg://pm_app:pm_local_only@localhost:5432/predictive_maintenance

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: pm_app
          POSTGRES_PASSWORD: pm_local_only
          POSTGRES_DB: predictive_maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm_app -d predictive_maintenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Validate database migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Run Ruff
        run: uv run ruff check src tests infrastructure/postgres/migrations scripts

      - name: Run strict Mypy
        run: uv run mypy src

      - name: Run test suite
        run: uv run pytest --cov=predictive_maintenance --cov-report=term-missing

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-validation:
    name: Validate local container definition
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  container-build:
    name: Build production container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python-quality, frontend-build, compose-validation]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API and worker image
        run: docker build --file Dockerfile.api --tag predictive-maintenance-api:ci .

      - name: Build dashboard image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
            --build-arg API_INTERNAL_URL=http://api:8000 \
            --file frontend/Dockerfile \
            --tag predictive-maintenance-dashboard:ci \
            frontend

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push images to Amazon ECR
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag predictive-maintenance-api:ci "$ECR_REGISTRY/predictive-maintenance-api:$IMAGE_TAG"
          docker tag predictive-maintenance-dashboard:ci "$ECR_REGISTRY/predictive-maintenance-dashboard:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/predictive-maintenance-api:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/predictive-maintenance-dashboard:$IMAGE_TAG"

      - name: Validate staging Compose configuration
        run: docker compose -f compose.yaml -f compose.staging.yaml config --quiet

      - name: Start staging services
        run: |
          PM_API_IMAGE=predictive-maintenance-api:ci \
          PM_DASHBOARD_IMAGE=predictive-maintenance-dashboard:ci \
          docker compose -f compose.yaml -f compose.staging.yaml up -d

      - name: Run staging smoke test
        run: python scripts/staging_smoke_test.py

      - name: Stop staging services
        if: always()
        run: docker compose -f compose.yaml -f compose.staging.yaml down --volumes

  deploy-lightsail:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      IMAGE_TAG: ${{ github.sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Configure SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pm_lightsail_deploy
          chmod 600 ~/.ssh/pm_lightsail_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull images and restart Lightsail services
        run: |
          ssh -i ~/.ssh/pm_lightsail_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "AWS_ACCESS_KEY_ID='$AWS_ACCESS_KEY_ID' AWS_SECRET_ACCESS_KEY='$AWS_SECRET_ACCESS_KEY' AWS_DEFAULT_REGION='$AWS_DEFAULT_REGION' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/predictive-maintenance-platform

          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="$account_id.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "$registry"

          docker pull "$registry/predictive-maintenance-api:$IMAGE_TAG"
          docker pull "$registry/predictive-maintenance-dashboard:$IMAGE_TAG"

          grep -v '^PM_API_IMAGE=' .env | grep -v '^PM_DASHBOARD_IMAGE=' > .env.deploy
          printf 'PM_API_IMAGE=%s/predictive-maintenance-api:%s\n' "$registry" "$IMAGE_TAG" >> .env.deploy
          printf 'PM_DASHBOARD_IMAGE=%s/predictive-maintenance-dashboard:%s\n' "$registry" "$IMAGE_TAG" >> .env.deploy
          mv .env.deploy .env
          chmod 600 .env

          docker compose -f compose.yaml -f compose.staging.yaml -f compose.aws.yaml up -d --force-recreate
          docker image prune -f
          REMOTE
